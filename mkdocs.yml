      - Analyzing repositories: guide/analyzing-repositories.md
      - Ownership analysis: guide/ownership-analysis.md
      - Hotspot analysis: guide/hotspot-analysis.md
      - Output formats: guide/output-formats.md
      - Automation and CI: guide/automation.md
